services:
  flask-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: flask-k8s-app:local
    container_name: flask-app
    ports:
      - "5000:5000"
    environment:
      - APP_ENV=development
      - PORT=5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
